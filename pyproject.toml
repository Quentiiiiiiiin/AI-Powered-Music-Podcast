[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-ai"
version = "0.0.1"
description = "AI music podcast auto generator (MVP scaffold)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "podcast-ai" }]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "pydub>=0.25.1",
  "librosa>=0.10.2.post1",
  "httpx>=0.27.0",
  "edge-tts>=7.2.7",
  "mutagen>=1.47.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
podcast-ai = "podcast_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
