app:
  # 本期节目候选音乐目录（用户按“目标歌单规划”准备好歌曲后放入此目录）
  music_dir: "./music"

  # 产出目录（规划文件、临时文件、最终音频与 show notes 等）
  output_dir: "./output"

  # v3.6：multi-agent 是否在 output_dir/audit/multi_agent/<request_id>/ 落盘每轮 Agent 与 state（默认 true；false 可关闭）
  # multi_agent_audit_enabled: true

audio:
  # 相邻歌曲-歌曲转场（秒）
  crossfade_seconds: 8.0

  # v2.0：串词与相邻歌曲边界的短时 crossfade（秒）；0 关闭试验过渡
  voice_music_crossfade_seconds: 3.0

  # 母带响度目标（LUFS）
  loudness_target_lufs: -14.0

  # 混音前是否对每首曲目/TTS 做平均电平 normalize（约 -16 dBFS）；false=保留源响度
  per_track_normalize_enabled: true
  # 仅串词：normalize 到该平均 dBFS；省略或 null=关闭
  # voice_normalize_to_dbfs: -16.0
  # 仅串词：额外固定增益（dB），正数变大
  voice_gain_db: 0.0
  # 串词→歌叠化窗内音乐增益上限（dB，相对满电平）。0=不限制；建议试 -6.0
  voice_music_overlay_music_max_db: 0.0
  # 叠化结束后从上限爬回满电平的时长（秒）；0=关闭；仅 max_db<0 时生效
  voice_music_post_overlay_ramp_seconds: 0.0

cache:
  enabled: true
  # 扫库缓存落盘位置（相对 output_dir 或绝对路径均可；后续任务会细化）
  dir: "./output/cache"

llm:
  provider: "openai_compatible"
  # 建议通过环境变量注入真实 key，不要写进配置文件
  api_key: ""
  base_url: ""
  model: "gpt-4o-mini"
  timeout_seconds: 60
  max_retries: 2
  # v4.6：OpenRouter 供应方路由（仅当 base_url 指向 OpenRouter 时写入请求体；留空=自动选路）
  # openrouter_provider: ""
  # v3.4：省略或 null = 仅当 base_url 为 OpenRouter 时附带 response_format；true/false 可强制开关
  # structured_output: false

tts:
  # v1.4 默认 elevenlabs；可改为 edge_tts 使用 Edge TTS
  provider: "elevenlabs"
  api_key: ""
  voice: ""
  # v1.4+：当 provider 为 elevenlabs 时必填 api_key、voice_id（见 require_elevenlabs_tts_config）
  elevenlabs:
    api_key: ""
    voice_id: ""
    model: "eleven_multilingual_v2"
    output_format: "mp3_44100_128"
  timeout_seconds: 60
  max_retries: 2

