app:
  music_dir: "./music"
  output_dir: "./output"

audio:
  crossfade_seconds: 8.0
  voice_music_crossfade_seconds: 0.0
  voice_music_intro_align_enabled: true
  voice_music_intro_align_max_seconds: 30.0
  loudness_target_lufs: -14.0
  # 听感实验：关闭每轨 simple_normalize，保留源/FLAC 电平
  per_track_normalize_enabled: false
  # 仅抬串词：先试固定增益（dB）；仍偏小可改 8/9，偏大可改 3/4
  voice_gain_db: 7.0
  # 可选：只把串词拉到目标平均电平（与 music 无关）。不需要时保持 null
  # voice_normalize_to_dbfs: -16.0
  # 串词→歌叠化窗内音乐增益上限（dB）；0=旧行为满电平淡入；-6～-9 更不易盖人声
  voice_music_overlay_music_max_db: -9.0
  # 叠化结束后音乐从上限爬回满电平（秒）；0=关闭
  voice_music_post_overlay_ramp_seconds: 0.7

cache:
  enabled: true
  dir: "./output/cache"

llm:
  provider: "openai_compatible"
  api_key: ""
  base_url: "https://openrouter.ai/api/v1"
  model: "deepseek/deepseek-v3.2"
  # model: "qwen/qwen3.6-flash"
  timeout_seconds: 60
  max_retries: 2

tts:
  provider: "elevenlabs"
  api_key: ""
  voice: ""
  # 通用超时/重试配置
  timeout_seconds: 60
  max_retries: 2
  # v1.4+：当 provider 为 elevenlabs 时必填 api_key、voice_id
  elevenlabs:
    api_key: ""
    voice_id: ""
    # model: "eleven_multilingual_v2"
    model: "eleven_v3"
    output_format: "mp3_44100_128"
  # v4.1：MiniMax（同步非流式）
  minimax:
    api_key: ""
    model: "speech-2.8-hd"
    # voice_id: "English_Sharp_Commentator"
    voice_id: "Chinese (Mandarin)_Crisp_Girl"
    query_interval_ms: 500
    query_timeout_seconds: 30
